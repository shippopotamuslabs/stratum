# Composite equivalent of the GitLab `.android-job` before_script:
# Java toolchain, google-services.json materialization, SDK licenses,
# and the preview-channel platform the app compiles against.
#
# Secret handling differs from GitLab on purpose: GitLab "File" variables
# arrive as a PATH in $GOOGLE_SERVICES_JSON; a GitHub secret is the file
# CONTENT, passed in by the caller as an input (composite actions cannot
# read the `secrets` context directly).
name: android-setup
description: Shared Android job setup (port of .android-job before_script)

inputs:
  google-services-json:
    description: Contents of app/google-services.json (pass secrets.GOOGLE_SERVICES_JSON)
    required: true
  java-version:
    description: JDK for Gradle (daemon JVM per gradle/gradle-daemon-jvm.properties)
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Materialize app/google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        test -n "$GOOGLE_SERVICES_JSON" || (echo "Missing GOOGLE_SERVICES_JSON secret — see header of .gitlab-ci.yml" && exit 1)
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        chmod +x gradlew

    # GitHub-hosted runners ship the Android SDK with ANDROID_HOME set, so
    # the GitLab shell-executor fallback ($HOME/Android/Sdk) is unnecessary;
    # the license + preview-platform steps are kept verbatim.
    - name: Accept SDK licenses and install compile platform
      shell: bash
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        command -v sdkmanager || (echo "sdkmanager not found under $ANDROID_HOME" && exit 1)
        # `yes` dies with SIGPIPE (141) once sdkmanager exits; tolerate only that.
        yes | sdkmanager --licenses > /dev/null || [ $? -eq 141 ]
        # The runner image pins an older SDK but the app compiles against 37,
        # a preview-channel platform published only as android-37.0.
        yes | sdkmanager --channel=3 "platforms;android-37.0" > /dev/null || [ $? -eq 141 ]
