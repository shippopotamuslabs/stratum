name: Forge Review

# Forge consolidated code review (forge-reviewer reusable workflow).
# One review per PR from PR-Agent + the two Thermos lenses, fused by
# the master job; re-pushes run verification instead of a new review.
# Requires repo secrets: OPENROUTER_API_KEY, FORGE_APP_PRIVATE_KEY.
#
# Supply-chain pinning (Forge review finding on this PR): the reusable
# workflow and the forge_ref scripts checkout are both pinned to the
# full commit SHA of the forge-reviewer GitHub port, not a mutable
# branch, and only the two secrets the reusable workflow declares are
# passed — never `secrets: inherit`. When forge-reviewer PR #1 merges
# and cuts the v1.1.0 tag, swap both pins to that tag in one commit.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  forge-review:
    uses: shippopotamuslabs/forge-reviewer/.github/workflows/forge-review.yml@3cc611c15766029653a209b9de05822c678e4594
    with:
      forge_ref: 3cc611c15766029653a209b9de05822c678e4594
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
