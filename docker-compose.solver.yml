# Local CP-SAT lab — bind-mount monorepo, keep Gradle cache on a named volume.
#
#   docker compose -f docker-compose.solver.yml build
#   docker compose -f docker-compose.solver.yml run --rm solver-lab ./scripts/solver-local.sh lab
#   docker compose -f docker-compose.solver.yml run --rm solver-lab ./scripts/solver-local.sh test OrToolsLoaderSmokeTest
#
# Prefer scripts/solver-local.sh which chooses host JVM when Docker is unavailable.

services:
  solver-lab:
    build:
      context: .
      dockerfile: solver-service/Dockerfile.local
    image: stratum-solver-lab:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - stratum-solver-gradle-cache:/home/solver/.gradle
    environment:
      GRADLE_USER_HOME: /home/solver/.gradle
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    # CP-SAT benefits from multiple cores; leave unset to use host default.
    # cpus: 4
    mem_limit: 8g
    stdin_open: true
    tty: true

volumes:
  stratum-solver-gradle-cache:
