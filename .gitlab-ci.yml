# Stratum CI — phase 1: merge-request gates + nightly device runs.
#
# Forge reviewer: included from the standalone forge-reviewer repo.
# Pinned to an immutable commit SHA. Tags like v1.0.3 are mutable and can be
# force-moved, which would run attacker-controlled pipeline code in this
# project's CI context (signing / google-services secrets). Human-readable
# tag: v1.0.11. BUMP PROCESS: resolve the new tag to its peeled commit SHA
# (git ls-remote https://gitlab.com/browntown.development-group/forge-reviewer.git,
# take the ^{} peeled value), review the template diff,
# then update `ref:` and FORGE_REF together.
include:
  - project: 'browntown.development-group/forge-reviewer'
    ref: fa55fd60481c19ce9450dd0f8ad31074974256fa # v1.0.11 — keep pinned, never a tag
    file: '/templates/forge.gitlab-ci.yml'

# ONE-TIME SETUP (GitLab project -> Settings -> CI/CD -> Variables):
# - GOOGLE_SERVICES_JSON (type: File): paste the contents of app/google-services.json.
#   The file is gitignored, so without this every Android job fails at configuration time.
# - KEYSTORE_BASE64 (type: File): base64 of the release keystore, never committed:
#     base64 -w0 .keystore/stratum_keystore.jks
# - STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (masked): keystore.properties values
#   (see keystore.properties.example). Reconstructs the gitignored keystore.properties.
# - PLAY_PUBLISHER_JSON (type: File): Play service-account JSON key. The account needs
#   Internal-track release rights (Play Console -> Users and permissions) plus, for the
#   robo job, Firebase Test Lab roles in GCP IAM.
# - FORGE TOKENS: OPENROUTER_API_KEY + PR_AGENT_GITLAB_TOKEN (api scope), both Masked.
#   These are the only secrets forge:* jobs need. They intentionally do NOT extend
#   .android-job, so they never copy google-services.json nor decode the keystore.
#   Keep every Android secret above Protected (forge jobs run on
#   merge_request_event and must not require them). Reviewed template v1.0.9 at the
#   pinned SHA: only forge:master posts to GitLab; egress is the GitLab API,
#   OpenRouter, and pinned pr-agent==0.46.0 from PyPI.
# - Optional: a pipeline schedule (e.g. nightly 02:00 UTC) to enable emulator-tests.
#
# OPTIONAL BUT RECOMMENDED (Settings -> Merge requests):
# - "Pipelines must succeed" + "All threads must be resolved" before merge.
#
# DELIBERATE NON-GOALS:
# - The Python solver suites are fast enough to gate MRs directly
#   (`solver-contract-tests` below); `solver-tests-nightly` exists only as a
#   schedule-based dependency-drift signal.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'schedule'

default:
  interruptible: true

variables:
  # Gradle home lives INSIDE the project dir so the `cache:` stanza on
  # .android-job can capture it: gcp jobs run on fresh VMs (one job per
  # worker), so dependency jars persist via the GCS cache, not a warm host
  # dir. (The old out-of-tree ../ci-home location existed for the home-server
  # shell executor, where `git clean -ffdx` would nuke an in-tree home and
  # jobs shared one builds dir. The runner restores the cache after checkout,
  # so git clean no longer threatens it. ANDROID_USER_HOME stays out-of-tree:
  # nothing in it needs to survive a job.)
  # NOTE: no $HOME here (empty in the runner's non-login shell) and no `:-`
  # defaults (GitLab expansion doesn't support them) — only predefined
  # variables.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.ci-gradle-home"
  ANDROID_USER_HOME: "$CI_PROJECT_DIR/../ci-home/android-home"
  # Daemon stays enabled: the shell executor + persistent out-of-tree home above
  # reuses it across invocations, so the ~7 cold JVM+configuration startups per
  # pipeline become warm. Caching duplicates gradle.properties so plain
  # `./gradlew` always benefits, even if this variable is ever dropped.
  GRADLE_OPTS: "-Dorg.gradle.caching=true"
  # OSV-Scanner release used by the osv-scan job. Bump when a new release lands
  # (check https://github.com/google/osv-scanner/releases).
  OSV_SCANNER_VERSION: "2.6.0"
  # Forge reviewer (standalone template). FORGE_REF selects which upstream
  # scripts .forge-setup downloads at runtime — same immutable pin as the
  # include above (tag shown for readability only); keep the two in sync.
  FORGE_ENABLED: "true"
  FORGE_REF: "fa55fd60481c19ce9450dd0f8ad31074974256fa" # v1.0.11 — keep pinned, never a tag

stages:
  - lint
  - test
  - nightly
  - deploy

# Shared setup for every Android job: Firebase config + SDK licenses.
.android-job:
  image:
    name: ghcr.io/cirruslabs/android-sdk:36
    # The job image is pre-baked into the worker image (see gcp/bake-builder.sh):
    # skip the re-pull on every job — faster cold starts, less egress.
    pull_policy: if-not-present
  # All Android jobs run on the GCP docker-autoscaler fleet: one fresh Spot
  # VM per job, deleted afterwards. Default tag gcp-small (n2-standard-2, no
  # nested virt) covers lint/test/scan/build jobs; jobs needing muscle or KVM
  # (assemble-release, emulator-tests) override to gcp-big (n2-standard-8,
  # nested virt). `image:` IS honored here — the container's SDK is the build
  # toolchain (the old home-server shell executor ignored it and used the
  # host toolchain). The home runner keeps Forge review, functions-tests,
  # and the deploy lane.
  tags: [gcp-small]
  # Spot VMs can be preempted mid-job: retry on infra failure.
  retry:
    max: 2
    when:
      - runner_system_failure
  # GCS-backed dependency cache (bucket stratum-runner-cache-a1a5b): every
  # job lands on a fresh VM, so without this each job would re-download all
  # dependencies. Restored after checkout; only jars + wrapper dists are
  # cached (the local build cache stays ephemeral to keep the archive small).
  cache:
    key:
      files:
        - gradle/libs.versions.toml
      prefix: gradle-deps
    paths:
      - .ci-gradle-home/caches/modules-2/
      - .ci-gradle-home/wrapper/
  before_script:
    - test -n "$GOOGLE_SERVICES_JSON" || (echo "Missing GOOGLE_SERVICES_JSON file variable — see header of .gitlab-ci.yml" && exit 1)
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json
    - chmod +x gradlew
    # Shell executor runs non-login shells that may not carry ANDROID_HOME/PATH;
    # fall back to the home-server SDK location so sdkmanager/adb resolve.
    - export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - command -v sdkmanager || (echo "sdkmanager not found under $ANDROID_HOME" && exit 1)
    # `yes` dies with SIGPIPE (141) once sdkmanager exits; tolerate only that.
    - yes | sdkmanager --licenses > /dev/null || [ $? -eq 141 ]
    # The job image pins SDK 34 but the app compiles against 37, which is a
    # preview-channel platform published only as android-37.0: ensure it is
    # present (idempotent — sdkmanager skips installed packages; `yes` covers
    # the preview license prompt non-interactively).
    - yes | sdkmanager --channel=3 "platforms;android-37.0" > /dev/null || [ $? -eq 141 ]
  # No cache stanza here: GitLab cache paths must live inside the project dir,
  # but GRADLE_USER_HOME above is a persistent out-of-tree home by design.
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

detekt:
  extends: .android-job
  stage: lint
  # needs: [] opts out of stage gating: this job is independent of every other
  # MR job, so with runner concurrent > 1 it starts immediately instead of
  # waiting for earlier stages. Same pattern on all independent lint/test jobs.
  needs: []
  script:
    - ./gradlew detekt
  artifacts:
    when: always
    paths:
      - '**/build/reports/detekt/'
    expire_in: 1 week

lint:
  extends: .android-job
  stage: lint
  needs: []
  script:
    - ./gradlew lintDebug
  artifacts:
    when: always
    paths:
      - '**/build/reports/lint-results-debug.html'
    expire_in: 1 week

unit-tests:
  extends: .android-job
  stage: test
  needs: []
  script:
    # JVM domain tests + every Android module's debug unit tests.
    # Solver tests are excluded by construction (see header).
    - ./gradlew testDebugUnitTest :core:domain:test
  artifacts:
    when: always
    paths:
      - '**/build/reports/tests/'
    reports:
      junit: '**/build/test-results/**/TEST-*.xml'
    expire_in: 2 weeks

assemble-debug:
  extends: .android-job
  stage: test
  needs: []
  script:
    - ./gradlew :app:assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 week

# Release gate: R8 shrinking/optimization, resource shrinking, Hilt, and the
# perf plugin only meet in release builds. Unsigned (no keystore in CI) — this
# validates minification, not ship-readiness.
assemble-release:
  extends: .android-job
  # Release builds stay on the big tier: R8 full-mode shrinking is the most
  # CPU-hungry step and this is the last gate before shipping (STR-75).
  tags: [gcp-big]
  stage: test
  needs: []
  script:
    - !reference [.keystore-bootstrap-optional, script]
    - ./gradlew :app:assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
      - .keystore-signed-flag
    expire_in: 1 week

functions-tests:
  image: node:24
  tags: [home-server]
  stage: test
  needs: []
  cache:
    key:
      files:
        - functions/package-lock.json
    paths:
      - functions/node_modules/
    policy: pull-push
  script:
    - cd functions
    - npm ci --no-audit --no-fund
    - npm run build
    - npm test
  # Unchanged functions/ code needs no re-test on MRs; main still always runs.
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - functions/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Solver JSON-boundary contract tests (STR-47): fixture validity, solver
# round-trip, leniency rows, version matrix (see solver-contract/tests/).
# No Android toolchain — lightweight python job on the home runner, same shape
# as functions-tests. No `changes:` gate and no allow_failure: any contract
# violation fails the pipeline.
# Round-trips against the REAL Python solver (STR-45): SOLVER_MODULE=solver
# with solver-python on PYTHONPATH. The stub_solver default is for solver-less
# local runs only — CI must never silently test the stub.
solver-contract-tests:
  image: python:3.12-slim
  tags: [home-server]
  stage: test
  needs: []
  variables:
    SOLVER_MODULE: solver
    PYTHONPATH: $CI_PROJECT_DIR/solver-python
  script:
    # Ephemeral venv in a job-private dir: the runner Python is externally
    # managed (PEP 668), and /tmp is host-shared (see osv-scan), so neither
    # system site nor /tmp is used for the test env.
    - python3 -m venv $CI_PROJECT_DIR/.tmp/contract-env
    - $CI_PROJECT_DIR/.tmp/contract-env/bin/pip install --quiet -r solver-contract/tests/requirements.txt -r solver-python/requirements.txt
    - $CI_PROJECT_DIR/.tmp/contract-env/bin/python -m pytest solver-contract/tests/ -q

# OSV vulnerability scanning: builds CycloneDX SBOMs from the resolved :app
# release runtime classpath and the :solver-service: runtime classpath (the
# Cloud Run fat JAR ships its own JVM dependency graph and is not a dependency
# of :app, so it needs its own SBOM) via scripts/generate-sbom.py — no Gradle
# lockfiles are committed to the repo — plus the functions lockfiles, then
# fails the job when OSV reports a known CVE. Runs on MRs and the default
# branch. Triage path: docs/security-scanning.md
osv-scan:
  extends: .android-job
  stage: lint
  needs: []
  script:
    # OSV-Scanner release binary (static Go binary; the shell executor can't run
    # the analyzer Docker images GitLab's own templates use). Always downloaded
    # fresh into a job-private dir: /tmp is host-shared and world-writable, so
    # executing a reused binary from there is a poisoning vector.
    - mkdir -p .tmp
    - ./scripts/install-osv-scanner.sh "$OSV_SCANNER_VERSION" "$CI_PROJECT_DIR/.tmp/osv-scanner"
    # Resolved dependency trees -> CycloneDX SBOMs (scripts/generate-sbom.py).
    # The generator exits nonzero on any FAILED (unresolved) dependency, so a
    # partial tree can never scan clean. :solver-service gets its own SBOM:
    # the Cloud Run fat JAR is deployed separately and is not on :app's
    # classpath, so its JVM dependencies would otherwise bypass the gate.
    - ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -q > /tmp/gradle-app-deps.txt
    - python3 scripts/generate-sbom.py < /tmp/gradle-app-deps.txt > bom.cdx.json
    - ./gradlew :solver-service:dependencies --configuration runtimeClasspath -q > /tmp/gradle-solver-deps.txt
    - python3 scripts/generate-sbom.py --component-name stratum-solver < /tmp/gradle-solver-deps.txt > bom-solver.cdx.json
    # Scan both SBOMs plus the functions lockfiles. Exit code 1 = CVEs found.
    # A repo-root .osv-scanner.toml (documented suppressions) applies to every
    # scanned file via --config when present.
    - |
      SCAN_ARGS="-L bom.cdx.json -L bom-solver.cdx.json --lockfile=functions/package-lock.json --lockfile=functions-python/requirements.txt"
      if [ -f .osv-scanner.toml ]; then SCAN_ARGS="$SCAN_ARGS --config=.osv-scanner.toml"; fi
      ./.tmp/osv-scanner scan source $SCAN_ARGS --format=table
  artifacts:
    when: always
    paths:
      - bom.cdx.json
      - bom-solver.cdx.json
    expire_in: 2 weeks

# Solver container-image CVE scan: builds the production Cloud Run image
# (solver-service/Dockerfile, repo root as context) and runs
# `osv-scanner scan image` against it, covering the OS/base-image layer
# (eclipse-temurin:17-jre-jammy plus libgomp1 from apt) that the SBOM-based
# osv-scan job cannot see. Triage path: docs/security-scanning.md.
# Tracked in #11 (implementation) / #12 (design).
#
# ROLLOUT: allow_failure stays true. The 2026-09-21 baseline (see
# docs/security-scanning.md) found 79 Ubuntu base-layer CVEs with no
# upstream fix, so a hard gate has no path to green — the job is an
# informational control plus Renovate base-update tracking. Revisit only if
# a fixable (especially network-reachable) image CVE appears. (Same
# precedent as emulator-tests / solver-tests-nightly.)
osv-scan-image:
  extends: .android-job
  stage: lint
  allow_failure: true
  needs: []
  before_script:
    - !reference [.android-job, before_script]
    # The job image carries no Docker CLI; the runner mounts the host daemon
    # socket, so install the static client (matches the host daemon version)
    # and build/inspect against the host daemon.
    - |
      if ! command -v docker >/dev/null 2>&1; then
        echo "Installing static Docker CLI"
        curl -fsSL --retry 3 "https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz" -o /tmp/docker.tgz
        tar -xzf /tmp/docker.tgz -C /tmp docker/docker
        install -m 0755 /tmp/docker/docker /usr/local/bin/docker
      fi
    - docker info
  # Docker image build + scan only matters when the solver image inputs change;
  # main still always runs. (Keeps allow_failure: true per the rollout note.)
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - solver-service/**/*
        - scripts/scan-solver-image.sh
        - gradle/libs.versions.toml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Same pinned installer as osv-scan (shell executor can't run the analyzer
    # Docker images GitLab's own templates use), into a job-private dir.
    - mkdir -p .tmp
    - ./scripts/install-osv-scanner.sh "$OSV_SCANNER_VERSION" "$CI_PROJECT_DIR/.tmp/osv-scanner"
    # Fat jar first: the Dockerfile COPYs it out of the repo-root context.
    - ./gradlew :solver-service:shadowJar
    # Fail-closed Docker guard, build, provenance, scan.
    # Exit code 1 = CVEs found, matching the osv-scan failure policy.
    - OSV_SCANNER_BIN="$CI_PROJECT_DIR/.tmp/osv-scanner" ./scripts/scan-solver-image.sh stratum-solver:ci

# Emulator tests on the gcp-big fleet: workers expose /dev/kvm (nested virt), so
# the emulator runs accelerated instead of slow unaccelerated.
# Nightly + allow_failure until green, then decide about per-MR.
# Covers AppLaunchTest (:app) and LiftDaoDeviceTest (:core:data) on real SQLite.
emulator-tests:
  extends: .android-job
  tags: [gcp-big]
  stage: nightly
  timeout: 2h
  allow_failure: true
  variables:
    # This cmdline-tools' avdmanager ignores ANDROID_AVD_HOME and writes the AVD
    # to $ANDROID_USER_HOME/avd, while the emulator searches ANDROID_AVD_HOME.
    # Point ANDROID_AVD_HOME at the location avdmanager actually uses.
    ANDROID_AVD_HOME: "${ANDROID_USER_HOME}/avd"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  before_script:
    - test -n "$GOOGLE_SERVICES_JSON" || (echo "Missing GOOGLE_SERVICES_JSON file variable — see header of .gitlab-ci.yml" && exit 1)
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json
    - chmod +x gradlew
    - export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
    - command -v sdkmanager || (echo "sdkmanager not found under $ANDROID_HOME" && exit 1)
    # `yes` dies with SIGPIPE (141) once sdkmanager exits; tolerate only that.
    - yes | sdkmanager --licenses > /dev/null || [ $? -eq 141 ]
    # compileSdk/targetSdk (37) are build-time only; the job image pins SDK 34.
    # 37 is a preview-channel platform published only as android-37.0: ensure
    # it is present (idempotent; `yes` covers the preview license prompt).
    - yes | sdkmanager --channel=3 "platforms;android-37.0" > /dev/null || [ $? -eq 141 ]
    # API 35 = lowest system image the host SDK carries (minSdk is 34, but
    # no android-34 image is installed or installable anymore — avdmanager
    # lists only 35/36/36.1 — so the AVD tracks the closest runtime above
    # minSdk. compileSdk/targetSdk (37) are unaffected: those are build-time.
    - sdkmanager "platform-tools" "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"
    - echo "no" | avdmanager create avd -n ci -k "system-images;android-35;google_apis;x86_64" --device "pixel_7" --force
    - test -f "$ANDROID_AVD_HOME/ci.ini" || (echo "AVD 'ci' was not created under $ANDROID_AVD_HOME" && exit 1)
    # Shrink the userdata partition in the AVD config itself: the emulator's
    # pre-boot disk check reads config.ini (it ignores -partition-size there),
    # and the runner disk can't fit the pixel_7 default (~7.4 GB needed).
    # Bytes format: the original value was bytes, and the "2048M" form was ignored.
    - grep "^disk.dataPartition.size=" "$ANDROID_AVD_HOME/ci.avd/config.ini" || echo "key absent originally"
    - sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/ci.avd/config.ini" && echo 'disk.dataPartition.size=2147483648' >> "$ANDROID_AVD_HOME/ci.avd/config.ini"
    # Disk diagnostics for the pre-boot space check.
    - df -h "$CI_PROJECT_DIR" /opt /tmp 2>/dev/null || df -h
    - du -sh .git 2>/dev/null || true
  script:
    # Fail fast when nested virtualization didn't reach this worker: without
    # /dev/kvm the emulator falls back to unaccelerated boot and burns the
    # adb wait instead of failing here (replaces the removed kvm-smoke job,
    # which ran in MR pipelines and so never gated this scheduled job).
    - test -c /dev/kvm || (echo "KVM device missing in job container"; ls -la /dev/kvm* 2>/dev/null || true; exit 1)
    # -partition-size 2048: the runner disk can't fit the pixel_7 default userdata
    # partition (needs ~7.4 GB, ~6.8 GB free); 2 GB is plenty for these tests.
    # Probe the emulator in the foreground for 90s: its pre-boot disk check fails
    # fast (FATAL) instead of hanging adb wait-for-device for 20 minutes.
    - timeout 90 $ANDROID_HOME/emulator/emulator -avd ci -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim -partition-size 2048 > /tmp/emu-probe.log 2>&1 || true
    - if grep -q "FATAL" /tmp/emu-probe.log; then echo "EMULATOR FATAL:"; grep "FATAL" /tmp/emu-probe.log | head -3; exit 1; fi
    - $ANDROID_HOME/emulator/emulator -avd ci -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim -partition-size 2048 &
    - timeout 1200 bash -c 'adb wait-for-device; while [[ -z $(adb shell getprop sys.boot_completed | tr -d "\r") ]]; do sleep 5; done'
    - ./gradlew :app:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest
  artifacts:
    when: always
    paths:
      - '**/build/reports/androidTests/'
      - '**/build/outputs/androidTest-results/'
    reports:
      junit: '**/build/outputs/androidTest-results/connected/*.xml'
    expire_in: 2 weeks

# Nightly solver signal (STR-46): the Kotlin :core:domain-solver-tests suite is
# gone with the Kotlin solver; the Python solver suite + contract suite (real
# solver) are the regression net now. Fast (~1 min); kept on a schedule (not
# per-MR — solver-contract-tests already gates MRs) to catch dependency drift
# (e.g. ortools bumps via Renovate) independent of MR traffic.
# allow_failure until the first scheduled run proves the whole suite green;
# then tighten it — a permanently-red nightly teaches everyone to ignore it.
# (STR-8 originally tracked tightening for the Kotlin suite; premise changed.)
solver-tests-nightly:
  image: python:3.12-slim
  tags: [home-server]
  stage: nightly
  timeout: 30m
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  variables:
    SOLVER_MODULE: solver
    PYTHONPATH: $CI_PROJECT_DIR/solver-python
  script:
    - python3 -m venv $CI_PROJECT_DIR/.tmp/solver-env
    - $CI_PROJECT_DIR/.tmp/solver-env/bin/pip install --quiet -r solver-contract/tests/requirements.txt -r solver-python/requirements.txt
    - $CI_PROJECT_DIR/.tmp/solver-env/bin/python -m pytest solver-python/tests/ solver-contract/tests/ -q --junitxml=$CI_PROJECT_DIR/.tmp/solver-nightly-junit.xml
  artifacts:
    when: always
    reports:
      junit: '.tmp/solver-nightly-junit.xml'
    expire_in: 2 weeks

# PRE-LAUNCH ADDITIONS (not now):
# - lintRelease once release-blocking lint is triaged.
# - Roborazzi screenshot tests (JVM, no emulator).
# - Coverage ratchet (Kover) on touched code.
# - Tighten test-lab-robo (allow_failure: true until the first green run).

# Play Internal-track lane (work item 7): manual on the default branch. The job
# reconstructs release signing from CI variables, so app/build.gradle.kts signs
# exactly like a local release build. Every upload needs a versionCode Play has
# not seen before — bump versionCode in app/build.gradle.kts before re-running,
# or the upload fails with a duplicate-version error.

# Shared keystore bootstrap for deploy jobs (STR-50 reviewer feedback).
# Single conditional script defined once as a YAML anchor. Both hidden jobs
# below reference it; the strict variant adds a flag check to fail fast.
# KEYSTORE_BASE64 is a File variable: a path to a file holding base64 text.
.keystore-setup: &keystore-setup
  - |
    if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
      mkdir -p .keystore
      base64 -d "$KEYSTORE_BASE64" > .keystore/stratum_keystore.jks
      printf 'storeFile=.keystore/stratum_keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
        "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      echo "SIGNED=true" > .keystore-signed-flag
      echo "Keystore configured — building signed APK"
    else
      echo "Keystore secrets not available — building unsigned APK"
      rm -f .keystore-signed-flag
    fi

# Fails if secrets are missing — for jobs that MUST be signed.
# Referenced via `!reference [.keystore-bootstrap, script]`.
.keystore-bootstrap:
  script:
    - *keystore-setup
    - test -f .keystore-signed-flag || (echo "Missing keystore secrets — see header of .gitlab-ci.yml" && exit 1)

# Optional keystore bootstrap: signs if secrets are available, builds unsigned
# otherwise. For jobs like assemble-release that run on MRs without secrets.
.keystore-bootstrap-optional:
  script:
    - *keystore-setup

deploy-internal:
  extends: .android-job
  # Stays on the home runner: needs the gcloud CLI + Play upload path the job
  # image doesn't carry, and it's a manual lane that runs rarely.
  tags: [home-server]
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - !reference [.keystore-bootstrap, script]
    - test -n "$PLAY_PUBLISHER_JSON" || (echo "Missing PLAY_PUBLISHER_JSON file variable — see header of .gitlab-ci.yml" && exit 1)
    # Signed AAB for Play + signed APK for the Test Lab robo job below.
    - ./gradlew :app:bundleRelease :app:assembleRelease
    # PEP 668: the runner Python is externally managed, so installer deps go
    # in an ephemeral venv rather than --user / system site.
    - python3 -m venv /tmp/play-env
    - /tmp/play-env/bin/pip install --quiet google-api-python-client google-auth
    - /tmp/play-env/bin/python scripts/play-upload-internal.py app/build/outputs/bundle/release/app-release.aab
  artifacts:
    # when: always — a failed upload still leaves the signed bundle behind
    # for a manual Console upload (declaration deadlocks like AD_ID/health).
    when: always
    paths:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
    expire_in: 2 weeks

# Firebase App Distribution: internal release builds for rapid iteration (STR-50).
# No version bump required — upload as often as needed. Targets the "Internal"
# tester group (Sean + Kelsey). Auto-runs on every main merge.
distribute-internal:
  extends: .android-job
  tags: [home-server]
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [assemble-release]
  script:
    - test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON file variable" && exit 1)
    - export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT_JSON"
    # Explicit contract: assemble-release must have produced a SIGNED APK.
    # The .keystore-signed-flag artifact proves secrets were available.
    - test -f .keystore-signed-flag || (echo "APK was not signed — keystore secrets missing in assemble-release" && exit 1)
    # Upload the already-built signed APK via Firebase CLI — no Gradle rebuild.
    - |
      shopt -s nullglob
      APK_FILES=(app/build/outputs/apk/release/*.apk)
      shopt -u nullglob
      if [ ${#APK_FILES[@]} -eq 0 ]; then echo "No APK found" && exit 1; fi
      if [ ${#APK_FILES[@]} -gt 1 ]; then echo "Multiple APKs found: ${APK_FILES[*]}" && exit 1; fi
      npx firebase-tools appdistribution:distribute "${APK_FILES[0]}" \
        --app 1:531671963823:android:8d383c6410df9ce894dc5a \
        --groups "Internal" \
        --release-notes "Build ${CI_COMMIT_SHORT_SHA} from main" \
        --non-interactive
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 1 week

# Firebase Test Lab robo test on the signed release APK from deploy-internal.
# allow_failure until the first green run proves the service-account IAM (Play
# Console grants alone are not enough for Test Lab — the account also needs
# Firebase Test Lab roles in GCP IAM) and the device combo below.
test-lab-robo:
  extends: .android-job
  # Stays on the home runner with deploy-internal: needs gcloud + the
  # service-account auth flow the job image doesn't carry.
  tags: [home-server]
  stage: deploy
  needs: [deploy-internal]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - gcloud auth activate-service-account --key-file="$PLAY_PUBLISHER_JSON"
    - PROJECT_ID=$(python3 -c "import json;print(json.load(open('app/google-services.json'))['project_info']['project_id'])")
    - APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
    # MediumPhone.arm is a virtual device: physical Pixels in Test Lab top out
    # below minSdk 34 for this account's catalog (panther maxes at 33).
    # Custom results bucket: the default test-lab-* bucket requires roles/editor,
    # but play-publisher uses least-privilege (testAdmin + analyticsViewer +
    # storage.objectAdmin on stratum-a1a5b-ftl-results).
    - gcloud --project="$PROJECT_ID" firebase test android run --type robo --app "$APK"
      --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait --timeout 5m --results-bucket=gs://stratum-a1a5b-ftl-results 2>&1 | tee test-lab-robo.log
  artifacts:
    when: always
    paths:
      - test-lab-robo.log
    expire_in: 2 weeks
